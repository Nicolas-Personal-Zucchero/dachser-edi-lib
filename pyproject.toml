[build-system]
requires = ["setuptools", "setuptools-scm", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dachser_edi"
version = "1.4.2"
description = "Libreria per generare XML EDI formato Dachser/TransportOrder"
authors = [
  { name="Nicolas Amadori", email="nicolas.amadori02@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.0",
]

[project.urls]
"Homepage" = "https://github.com/Nicolas-Personal-Zucchero/dachser-edi-lib"